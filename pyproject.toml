[tool.ruff]
line-length = 88
target-version = "py310"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
